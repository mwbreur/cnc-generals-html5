name: Build and deploy game

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "verify_system.js"
      - "build.js"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "verify_system.js"
      - "build.js"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify, and package GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Run lint, headless verification, audio checks, and build
        run: npm test

      - name: Run Playwright headless browser E2E (Skirmish & Two-Peer Multiplayer)
        run: |
          npm ci --no-audit --no-fund
          for attempt in 1 2 3; do
            if npx playwright install --only-shell chromium; then
              break
            fi
            echo "Playwright browser binary download attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          if ! node scripts/e2e_smoke.mjs; then
            echo "Initial E2E attempt failed; installing missing system deps with apt retries and re-running..."
            sudo apt-get update -o Acquire::Retries=3 || true
            npx playwright install-deps --only-shell chromium || true
            node scripts/e2e_smoke.mjs
          fi

      - name: Verify generated assets/data bundle integrity
        run: |
          test -f index.html
          test -f assets/data/02b_w3d_models.js
          test -f assets/data/07b_tournament_desert.js
          test -f assets/data/10b_cameos.js
          count=$(ls -1 assets/data | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "Unexpected file count in assets/data: $count"
            ls -la assets/data
            exit 1
          fi

      - name: Package static Pages artifact
        run: |
          mkdir -p _site/assets _site/src
          cp index.html _site/
          cp -r assets/data _site/assets/
          cp -r src/audio _site/src/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
