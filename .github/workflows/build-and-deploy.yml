name: Build and deploy game

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "verify_system.js"
      - "build.js"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "verify_system.js"
      - "build.js"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify, and package GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run headless verification & audio checks
        run: |
          node verify_system.js
          node tools/validate_audio_catalog.js
          node tools/test_audio_loader.js

      - name: Build playable site
        run: node build.js

      - name: Run Playwright headless browser E2E smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --only-shell chromium --with-deps
          node scripts/e2e_smoke.mjs

      - name: Package static Pages artifact
        run: |
          mkdir -p _site/assets _site/src
          cp index.html _site/
          cp -r assets/data _site/assets/
          cp -r src/audio _site/src/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
